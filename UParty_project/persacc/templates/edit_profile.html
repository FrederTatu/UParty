{% extends 'base.html' %}
{% block content %}
<h2>Редактировать профиль</h2>
<form method="POST" enctype="multipart/form-data">
    {% csrf_token %}
    <div class="form-group">
        <label>Имя:</label><br>
        <input type="text" name="first_name" value="{{ user.first_name }}">
    </div>
    <div class="form-group">
        <label>Фамилия:</label><br>
        <input type="text" name="last_name" value="{{ user.last_name }}">
    </div>
    <div class="form-group">
        <label>Телефон:</label><br>
        <input type="text" name="phone" value="{{ user.profile.phone }}">
    </div>
    <div class="form-group">
        <label>Аватар:</label><br>
        <input type="file" name="avatar">
        {% if user.profile.avatar %}
            <div>Текущий: {{ user.profile.avatar.name }}</div>
        {% endif %}
    </div>
    <div class="form-group">
        <label>Дата рождения:</label><br>
        <input type="date" name="date_of_birth"
               value="{{ user.profile.date_of_birth|date:'Y-m-d' }}">
    </div>
    <div class="form-group">
        <label>Пол:</label><br>
        <select name="gender">
            <option value="none" {% if user.profile.gender == 'none' %}selected{% endif %}>
                Не указывать
            </option>
            <option value="male" {% if user.profile.gender == 'male' %}selected{% endif %}>
                Мужской
            </option>
            <option value="female" {% if user.profile.gender == 'female' %}selected{% endif %}>
                Женский
            </option>
        </select>
    </div>
    <div style="margin-top: 20px;">
        <button type="submit">Сохранить</button>
        <a href="{% url 'profile' %}"><button type="button">Отмена</button></a>
    </div>
</form>
{% endblock %}
